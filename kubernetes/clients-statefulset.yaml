apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trustfed-clients
spec:
  serviceName: "trustfed-clients-headless"
  replicas: 3
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: localhost/trustfed-client:v2
        imagePullPolicy: IfNotPresent
        # Each Pod serves the upload GUI and trains on its own uploaded CSV.
        command: ["python", "-m", "visualization.app"]
        args:
          - "client"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8501"
          - "--coordinator-url"
          - "http://trustfed-coordinator:8000"
        ports:
          - name: client-gui
            containerPort: 8501
            protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: trustfed-clients-headless
spec:
  clusterIP: None
  selector:
    app: client
  ports:
    - name: client-gui
      port: 8501
      targetPort: client-gui