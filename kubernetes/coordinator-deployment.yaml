apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  labels:
    app: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      containers:
      - name: coordinator
        image: localhost/trustfed-coordinator:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: TRUSTFED_DB_PATH
          value: "/app/state/coordinator.sqlite3"
        - name: TRUSTFED_AGGREGATOR
          value: "trustfed"
        - name: TRUSTFED_VALIDATION_PATH
          value: "/app/data/coordinator_val_set.csv"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: trustfed-storage
          mountPath: "/app/state"
      volumes:
      - name: trustfed-storage
        persistentVolumeClaim:
          claimName: trustfed-pvc
